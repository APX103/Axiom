# axiom-core 配置文件样板。
#
# 用法: 复制为 config.toml, 填入真实 key, 即可直接 axiom serve / axiom run。
# config.toml 已被 .gitignore 忽略 (含 key, 不进 git)。
#
# 优先级: 环境变量 (AXIOM_ 前缀) > config.toml > 代码默认值。

# ---- 服务 ----
host = "0.0.0.0"        # 0.0.0.0 = 局域网可访问
port = 8000
# data_dir = "~/.axiom"   # SQLite + workspace 默认目录; 不填用默认

# ---- LLM (必填, OpenAI 兼容协议) ----
# 国内外模型都行: StepFun / DeepSeek / 通义 / 智谱 / Moonshot / OpenAI 等
[models.large]
model = "step-3.7-flash"
base_url = "https://api.stepfun.com/step_plan/v1"
api_key = "sk-在这里填你的key"
max_tokens = 8192
context_window = 256000   # 必须匹配真实模型上下文长度, 否则 Rolling Compact 会在爆窗后才触发

# 可选: 小模型 (轻量任务) / 中模型 (中间档); 不填则统一用 large
# [models.small]
# model = "..."
# base_url = "..."
# api_key = "..."

# ---- 联网检索 (MCP server) ----
# 智谱 web-search-prime (默认); 也可换成任何兼容 MCP 的搜索服务
[[mcp_servers]]
name = "web_search_prime"
url = "https://open.bigmodel.cn/api/mcp/web_search_prime/mcp"
[mcp_servers.headers]
Authorization = "Bearer 在这里填MCP的token"

# ---- Agent Registry 能力目录服务 (可选) ----
# 发现层是标准 MCP Server (Streamable HTTP)。enabled 后自动作为名为
# "agent-registry" 的 MCP server 注入所有会话, 工具形如
# mcp__agent-registry__search_resources (只返回摘要);
# 配合内置 mcp_read_resource 工具读取 agent:// mcp:// skill:// resource 详情。
# 与 [[mcp_servers]] 中同名的用户配置去重 (用户配置优先)。
# [registry]
# enabled = false
# url = "https://registry.example.com"   # 实际请求 {url}/mcp
# api_key = "ar_在这里填你的key"          # 作为 Authorization: Bearer 头

# ---- A2A 调用远端 agent (可选) ----
# call_agent 工具用: 经 registry 发现 agent 后, 以 A2A 协议 (JSON-RPC + SSE) 调用。
# [a2a]
# default_timeout = 120   # message/stream 聚合等待上限 (秒)

# ---- 审稿 / 收敛审查 (可选) ----
# 开启后 agent 长任务会触发 reviewer checkpoint, 自动检查 fabricated citation /
# 后半段跑偏等问题。reviewer_model 不填则使用 [models].reviewer, 仍不填则用主模型。
[verification]
enabled = false
# reviewer_model = "step-3.7-flash"
# max_consecutive_bounces = 3
# min_checkpoint_interval_ms = 30000

# ---- 数据源 API keys (可选) ----
[api_keys]
# OpenAlex: 不填也能用 (走 mailto 礼仪); 填了更稳
OPENALEX_API_KEY = ""
# 其他数据源按需加:
# SEMANTIC_SCHOLAR_API_KEY = ""
