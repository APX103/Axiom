name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.0.3)'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            arch: aarch64
            platform: macos
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            arch: x86_64
            platform: linux

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify version consistency
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # 从 tag (v0.0.12) strip 掉前导 v 得到期望版本, 调 scripts/check_version.py
          EXPECTED="${TAG#v}"
          python scripts/check_version.py --expected "$EXPECTED"

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 'latest'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Sync Python deps
        run: uv sync

      - name: Build Python backend
        run: uv run pyinstaller operon-backend.spec --clean --noconfirm

      - name: Build frontend
        run: |
          cd frontend
          bun install
          bun run build

      - name: Build Tauri bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          cd src-tauri
          bun x @tauri-apps/cli build --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}-bundle
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*-bundle'

      - name: Resolve tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate latest.json
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          mkdir -p artifacts
          # strip 前导 v (tag 形如 v0.0.12), version 字段用纯数字版本
          VERSION="${TAG#v}"
          cat > artifacts/latest.json <<EOF
          {"version":"${VERSION}","url":"https://github.com/APX103/Axiom/releases/tag/${TAG}"}
          EOF
          echo "--- latest.json ---"
          cat artifacts/latest.json

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Axiom ${{ steps.vars.outputs.tag }}
          # 不能是 draft: /releases/latest/download/latest.json 只对最新"正式"release 生效,
          # draft release 在那个 URL 下是 404, 会导致 app 检查更新永远失败。
          draft: false
          prerelease: false
          files: |
            artifacts/*-bundle/**/*
            artifacts/latest.json
