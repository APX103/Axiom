name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# 同一分支的新 push 取消正在跑的旧 run, 省 CI 配额
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Sync Python deps (incl. dev)
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check axiom_core tests

      - name: Version consistency
        run: uv run python scripts/check_version.py

      - name: Unit tests (pytest)
        run: uv run pytest -q
        # 注: 不跑 frontend/e2e (需真 LLM key + 浏览器, CI 上必失败)

      - name: Frontend install
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Frontend build (tsc typecheck + vite build)
        working-directory: frontend
        run: bun run build
